openapi: 3.1.1

info:
  title: Points API
  version: 1.0.0
  summary: Points API
  description: |
    Points API for Loyalty Engine.

    Provides functionality for:
      - Granting points to customers
      - Retrieving customer points with pagination
      - Creating and managing point types
      - Creating redemption rules
      - Processing customer redemptions
      - Tracking point transactions

    Source code: https://github.com/loyaltyengine/points-service
  contact:
    name: Loyalty Engine
    url: https://www.loyaltyengine.org
    email: hello@loyaltyengine.org
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.loyaltyengine.org
    description: Live server

paths:
  /points-api/v1/properties/{propertyId}/customers/{customerId}/points:
    post:
      summary: Grant points to a customer
      description: |
        Grant points to a customer for a specific property
      operationId: grantPoints
      security:
        - bearerAuth: []
        - apiKey: []
      tags:
        - points
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
          description: Property ID
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          description: Customer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePointRequest'
      responses:
        '201':
          description: Points granted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointResponse'
    get:
      summary: List customer points
      description: |
        Retrieve all points for a specific customer and property
      operationId: getCustomerPoints
      security:
        - bearerAuth: []
        - apiKey: []
      tags:
        - points
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
          description: Property ID
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          description: Customer ID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Page size
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: createdAt
          description: Sort field
        - name: order
          in: query
          required: false
          schema:
            type: string
            default: asc
          description: Sort order (asc or desc)
      responses:
        '200':
          description: Points retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsResponse'

  /points-api/v1/properties/{propertyId}/types:
    post:
      summary: Create a point type
      description: |
        Create a new point type for a property
      operationId: createPointType
      security:
        - bearerAuth: []
        - apiKey: []
      tags:
        - point-types
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
          description: Property ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePointTypeRequest'
      responses:
        '201':
          description: Point type created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointTypeResponse'

  /points-api/v1/properties/{propertyId}/redemptions/rules:
    post:
      summary: Create a redemption rule
      description: |
        Create a new redemption rule for a property
      operationId: createRedemptionRule
      security:
        - bearerAuth: []
        - apiKey: []
      tags:
        - redemptions
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
          description: Property ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRedemptionRuleRequest'
      responses:
        '201':
          description: Redemption rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionRuleResponse'

  /points-api/v1/properties/{propertyId}/customers/{customerId}/redemptions:
    post:
      summary: Create a redemption
      description: |
        Create a new redemption for a customer
      operationId: createRedemption
      security:
        - bearerAuth: []
        - apiKey: []
      tags:
        - redemptions
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
          description: Property ID
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          description: Customer ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRedemptionRequest'
      responses:
        '201':
          description: Redemption created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication

  schemas:
    CreatePointRequest:
      type: object
      properties:
        pointTypeId:
          $ref: '#/components/schemas/PointTypeId'
        numberOfPoints:
          $ref: '#/components/schemas/NumberOfPoints'
        validFrom:
          $ref: '#/components/schemas/ValidFrom'
        expireAt:
          $ref: '#/components/schemas/ExpireAt'
        description:
          $ref: '#/components/schemas/PointDescription'
      required:
        - numberOfPoints

    PointResponse:
      allOf:
        - $ref: './shared/schemas/Response.yaml'
        - type: object
          properties:
            point:
              $ref: '#/components/schemas/Point'

    PointsResponse:
      allOf:
        - $ref: './shared/schemas/Response.yaml'
        - type: object
          properties:
            page:
              $ref: '#/components/schemas/Page'
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
    Point:
      type: object
      description: |
        Points entry
      properties:
        pointId:
          $ref: '#/components/schemas/PointId'
        customerId:
          $ref: './shared/schemas/CustomerId.yaml'
        propertyId:
          $ref: './shared/schemas/PropertyId.yaml'
        pointTypeId:
          $ref: '#/components/schemas/PointTypeId'
        numberOfPoints:
          $ref: '#/components/schemas/NumberOfPoints'
        remainingPoints:
          $ref: '#/components/schemas/NumberOfPoints'
        validFrom:
          $ref: '#/components/schemas/ValidFrom'
        expireAt:
          $ref: '#/components/schemas/ExpireAt'
        description:
          $ref: '#/components/schemas/PointDescription'
        createdAt:
          type: string
          format: date-time
          example: "2026-06-05T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-05T15:45:00Z"
        status:
          type: string
          enum: [PENDING, ACTIVE, CANCELLED]
          default: ACTIVE
          example: "ACTIVE"

    PointTransaction:
      type: object
      description: An entry tracking points movement.
      properties:
        transactionId:
          type: string
          example: "tx_88f92a"
        propertyId:
          $ref: './shared/schemas/PropertyId.yaml'
        customerId:
          $ref: './shared/schemas/CustomerId.yaml'
        type:
          type: string
          enum: [CREDIT, DEBIT]
          description: CREDIT increments points, DEBIT decrements points.
        amount:
          $ref: '#/components/schemas/NumberOfPoints'
        reason:
          type: string
          enum: [GRANT, REDEMPTION, EXPIRATION, CANCELLED]
        pointId:
          $ref: '#/components/schemas/PointId'
        createdAt:
          type: string
          format: date-time
    # PointType
    PointType:
      type: object
      description: |
        Point type
      properties:
        pointTypeId:
          $ref: '#/components/schemas/PointTypeId'
        propertyId:
          $ref: './shared/schemas/PropertyId.yaml'
        name:
          type: string
          example: "referral_reward"
        numberOfPoints:
          $ref: '#/components/schemas/NumberOfPoints'

    CreatePointTypeRequest:
      type: object
      properties:
        name:
          type: string
          example: "referral_reward"
        description:
          type: string
          example: "Referral reward"
        numberOfPoints:
          $ref: '#/components/schemas/NumberOfPoints'
      required:
        - numberOfPoints
        - name

    PointTypeResponse:
      allOf:
        - $ref: './shared/schemas/Response.yaml'
        - type: object
          properties:
            pointType:
              $ref: '#/components/schemas/PointType'

    # Redemption
    Redemption:
      type: object
      description: A redemption
      properties:
        redemptionId:
          type: string
          example: "red_33a11b"
        propertyId:
          $ref: './shared/schemas/PropertyId.yaml'
        customerId:
          $ref: './shared/schemas/CustomerId.yaml'
        redemptionType:
          $ref: '#/components/schemas/RedemptionType'
        targetId:
          type: string
          description: Generic pointer to the generated reward. If type is COUPON, this holds the couponId.
          example: "5a3d8d0b-9f0b-4f6b-9c20-5a7d8c0b5c8d"
        points:
          type: integer
          minimum: 0
          example: 10
          description: Number of individual points points granted or spent.
        createdAt:
          type: string
          format: date-time
    
    RedemptionResponse:
      allOf:
        - $ref: './shared/schemas/Response.yaml'
        - type: object
          properties:
            redemption:
              $ref: '#/components/schemas/Redemption'

    CreateRedemptionRequest:
      type: object
      description: A redemption request
      properties:
        redemptionType:
          $ref: '#/components/schemas/RedemptionType'
        numberOfPoints:
          type: integer
          minimum: 0
          example: 10
          description: Number of individual points points granted or spent.

    # Redemption rules
    RedemptionRule:
      type: object
      description: Configuration rule specifying the value metric of a single point to unlock or calculate dynamic redemptions.
      required:
        - propertyId
        - pointTypeId
        - redemptionType
        - valuePerSinglePoint
        - couponType
      properties:
        propertyId:
          $ref: './shared/schemas/PropertyId.yaml'
        pointTypeId:
          $ref: '#/components/schemas/PointTypeId'
        redemptionType:
          $ref: '#/components/schemas/RedemptionType'
        couponType:
          type: string
          description: Dictates if the single point value represents a monetary fiat currency weight or a fractional percentage weight.
          enum: [percentage, fixed_amount]
        valuePerSinglePoint:
          type: number
          format: double
          minimum: 0
          description: >
            The weight of 1 single point. 
            If couponType is 'fixed_amount', this is the fiat monetary value (e.g., 0.10 means 1 point = $0.10).
            If couponType is 'percentage', this is the percentage value (e.g., 0.10 means 1 point = 0.10% off the total basket).
          example: 0.10
        amountCurrency:
          $ref: '#/components/schemas/Currency'
          description: Required if couponType is 'fixed_amount'. Denominates the currency of the valuePerSinglePoint.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RedemptionRuleResponse:
          allOf:
            - $ref: './shared/schemas/Response.yaml'
            - type: object
              properties:
                redemptionRule:
                  $ref: '#/components/schemas/RedemptionRule'

    CreateRedemptionRuleRequest:
      type: object
      properties:
        propertyId:
          $ref: './shared/schemas/PropertyId.yaml'
        pointTypeId:
          $ref: '#/components/schemas/PointTypeId'
        redemptionType:
          $ref: '#/components/schemas/RedemptionType'
        couponType:
          type: string
          enum: [percentage, fixed_amount]
        numberOfPoints:
          type: integer
          minimum: 0
          example: 10
          description: Number of points required
        equivalentValue:
          type: number
          minimum: 0
          example: 10
        amountCurrency:
          $ref: '#/components/schemas/Currency'

    NumberOfPoints:
      type: integer
      minimum: 0
      example: 10
      description: Number of individual points points granted or spent.

    Currency:
      type: string
      description: |
        Coupon currency. ISO 4217 currency code.
      example: USD
    
    RedemptionType:
      type: string
      enum: [COUPON, CASHBACK]
      example: "COUPON"

    PointDescription:
      type: string

    PointTypeId:
      type: string
      description: Unique identifier linking to administrative configuration templates.
      example: "pt_type_ref_01"

    PointId:
      type: string
      description: Unique transactional reference tracking an active point entry.
      example: "pt_992a8f"

    ExpireAt:
      type: string
      format: date-time
      example: 2026-09-30T15:30:00Z

    ValidFrom:
      type: string
      format: date-time
      example: 2026-06-05T12:50:00Z
    ErrorType:
        type: string
        enum:
          - invalid_request
          - insufficient_points
          - unauthorized
          - forbidden
          - not_found
          - validation_error
          - internal_server_error
          - conflict_error
    ErrorResponse:
      description: A standard error response
      allOf:
        - $ref: './shared/schemas/Response.yaml'
        - type: object
          properties:
            error:
              $ref: '#/components/schemas/ErrorType'
              description: The error type
            description:
              type: string
              description: A human-readable description of the error
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

          required:
            - error
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: The field related to the error
        issue:
          type: string
          description: A description of the issue with the field
      required:
        - field
        - issue
    Page:
      type: object
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 150
        sort:
          type: string
          example: 'createdAt'
        order:
          type: string
          example: 'asc'
